plugins {
    id 'eclipse'
    id 'idea'
    //id 'net.minecraftforge.gradle' version '6.0.24'
    id "net.neoforged.moddev.legacyforge" version "2.0.141"
}

group = project.mod_group_id
version = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

legacyForge {
    version = project.mc_version + "-" + project.forge_version

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
        }

        server {
            server()
        }
        data {
            data()
            sourceSet = sourceSets.main
        }
    }
    mods {
        "$mod_id" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    flatDir {
        dir 'libs'
    }
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        url = 'https://maven.blamejared.com'
    }
    //maven {
    //    name = 'GTCEu Maven'
    //    url = 'https://maven.gtceu.com'
    //    content {
    //        includeGroup 'com.gregtechceu.gtceu'
    //    }
    //}
    //maven {
    //    name = "expandiumReleases"
    //    url = "https://repo.expandium.net/releases"
    //    content {
    //        includeGroup 'com.gregtechceu.gtceu'
    //    }
    //}
    //maven {
    //    name = "githubPackages"
    //    url = "https://maven.pkg.github.com/StarT-Dev-Team/GTM-StarT-Fork"
    //    content {
    //        includeGroup 'com.gregtechceu.gtceu'
    //    }
    //}
    maven {
        // LDLib (LowDragLib); GregTech bundles it via JarJar at runtime, so it is only needed at compile time
        name = 'FirstDarkDev Maven'
        url = 'https://maven.firstdark.dev/snapshots'
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
    maven {
        // Create, Ponder, Flywheel
        url = 'https://maven.createmod.net'
    }
}

dependencies {
    //minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
    
    // compile against JEI APIs but do not include them at runtime
    modCompileOnly("mezz.jei:jei-$mc_version-forge-api:$jei_version") { transitive = false }
    modCompileOnly("mezz.jei:jei-$mc_version-common-api:$jei_version") { transitive = false }
    // at runtime, use the full JEI jar for Forge
    modRuntimeOnly("mezz.jei:jei-$mc_version-forge:$jei_version") { transitive = false }

    modImplementation("com.gregtechceu.gtceu:gtceu-st-$mc_version:$gtm_version") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-$mc_version:$ldlib_version") { transitive = false }
    modImplementation("com.simibubi.create:create-$mc_version:$create_version:slim")

    // JSON serialization
    implementation "com.google.code.gson:gson:2.10.1"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
